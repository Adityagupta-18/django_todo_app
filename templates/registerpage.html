{% extends "base.html" %}
{% block body %}


<div class="container card p-3 my-5 bg-secondary" style="width: 50%; margin: auto auto;">
    <h2 class="text-light">Register</h2>
    <hr style="border: 1px solid whitesmoke ;">

    {% if messages %}
        {% for message in messages %}
        <div class="alert alert-info text-primary" role="alert">
            {{ message }}
        </div>
        {% endfor %}
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="form-group text-light">
            <label for="fname">First Name</label>
            <input type="text" class="form-control mt-1 mb-3" id="firstname" name='firstname' required placeholder="">
        </div>
        <div class="form-group text-light">
            <label for="lname">Last Name</label>
            <input type="text" class="form-control mt-1 mb-3" id="lastname" name='lastname' placeholder="">
        </div>
        <div class="form-group text-light">
            <label for="username">Username</label>
            <input type="text" class="form-control mt-1 mb-3" id="username" name='username' required placeholder="">
        </div>
        <div class="form-group text-light">
            <label for="pwd">Password</label>
            <input type="password" class="form-control mt-1 mb-3" id="password" name="password" required placeholder="">

            <button type="submit" class="btn btn-sm btn-primary mt-2">Submit</button>

    </form>
</div>

{% endblock body %}
