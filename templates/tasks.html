{% extends "base.html" %}
{% block pagetitle %}Tasks{% endblock pagetitle %}
{% block body %}
<h1 class="text-center mt-5 ">Tasks List</h1>
<div class="container" style="width: 80vw; display: flex; align-items: center; justify-content: center;">
  <table class="mt-3 table table-secondary table-striped table-bordered border-dark align-middle">
    <thead>
      <tr>
        <th class="w-10 text-center" scope="col">S No.</th>
        <th class="w-25" scope="col">Title</th>
        <th class="w-50" scope="col">Description</th>
        <th class="w-15 text-center" scope="col">Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for task in tasks %}
      <tr>
        <th scope="row">{{forloop.counter}}</th>
        <td>{{task.tasktitle}}</td>
        <td>{{task.taskdesc}}</td>
        <td>
          <div class="d-flex justify-content-center align-items-center">

            <a href="{% url 'edittask' task.id %}" class="btn btn-light btn-sm mx-2 d-flex align-items-center">
              <i class="bi bi-pencil-square me-1"></i> Edit
            </a>

            <a href="#" class="btn btn-outline-danger btn-sm mx-2 d-flex align-items-center">
              <i class="bi bi-trash-fill me-1"></i> Delete
            </a>
          </div>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

</div>
<div style="display:flex; align-items: center; justify-content: center;">
  <a href="/"> Add more </a>
</div>
{% endblock body %}
